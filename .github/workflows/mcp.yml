name: MCP source installation
on:
  push:
    paths: ['src/**', 'scripts/**', 'package.json', 'bun.lock', 'bun.lockb', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['src/**', 'scripts/**', 'package.json', 'bun.lock', 'bun.lockb', '.github/workflows/mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and generate client configuration
        run: bash scripts/setup-mcp.sh > mcp-config.json
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun test
      - name: Verify compiled MCP initialization and discovery
        run: bun run verify:mcp
